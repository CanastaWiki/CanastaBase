name: Rescan published images

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

concurrency:
  group: rescan-published-canasta-base-images
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  packages: read

env:
  IMAGE: ghcr.io/canastawiki/canasta-base
  ISSUE_TITLE: Scheduled CanastaBase image vulnerability scan

jobs:
  scan:
    name: Scan published tags
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine current tags
        id: tags
        run: |
          MEDIAWIKI_VERSION=$(sed -nr 's/.*MW_CORE_VERSION=([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' Dockerfile | head -n1)
          MEDIAWIKI_BRANCH=${MEDIAWIKI_VERSION%.*}
          CANASTA_VERSION=$(cat VERSION)

          if [[ ! "$MEDIAWIKI_BRANCH" =~ ^[0-9]+\.[0-9]+$ ]] ||
             [[ ! "$CANASTA_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not determine valid published image tags."
            exit 1
          fi

          {
            echo "mediawiki=$MEDIAWIKI_BRANCH-latest"
            echo "version=$CANASTA_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.70.0
          cache: true

      - name: Scan tags and prepare report
        id: scan
        env:
          MEDIAWIKI_TAG: ${{ steps.tags.outputs.mediawiki }}
          VERSION_TAG: ${{ steps.tags.outputs.version }}
        run: |
          RESULT_DIR="$RUNNER_TEMP/trivy-results"
          mkdir -p "$RESULT_DIR"
          SUMMARY="$RESULT_DIR/summary"
          FINDINGS="$RESULT_DIR/findings"
          : > "$SUMMARY"
          : > "$FINDINGS"
          TOTAL=0

          for TAG in latest "$MEDIAWIKI_TAG" "$VERSION_TAG"; do
            MANIFEST=$(docker buildx imagetools inspect --raw "$IMAGE:$TAG")
            for ARCH in amd64 arm64; do
              DIGEST=$(jq -er --arg arch "$ARCH" \
                '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' \
                <<< "$MANIFEST")
              RESULT="$RESULT_DIR/${TAG}-${ARCH}.json"

              trivy image \
                --image-src remote \
                --format json \
                --output "$RESULT" \
                --ignore-unfixed \
                --severity CRITICAL,HIGH \
                "$IMAGE@$DIGEST"

              COUNT=$(jq '[.Results[]?.Vulnerabilities[]?] | length' "$RESULT")
              TOTAL=$((TOTAL + COUNT))
              printf '| `%s` | `%s` | %s |\n' "$TAG" "$ARCH" "$COUNT" >> "$SUMMARY"
              jq -r --arg tag "$TAG" --arg arch "$ARCH" '
                [.Results[]?.Vulnerabilities[]?]
                | sort_by(.VulnerabilityID, .PkgName, .InstalledVersion)
                | unique_by(.VulnerabilityID, .PkgName, .InstalledVersion)
                | .[]
                | [$tag, $arch, .Severity, .VulnerabilityID, .PkgName, .InstalledVersion, (.FixedVersion // "")]
                | @tsv
              ' "$RESULT" >> "$FINDINGS"
            done
          done

          REPORT="$RESULT_DIR/report.md"
          {
            echo "Trivy found **$TOTAL** fixable HIGH/CRITICAL vulnerabilities in the current published images."
            echo
            echo "[View workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo
            echo '| Tag | Platform | Findings |'
            echo '| --- | --- | ---: |'
            cat "$SUMMARY"

            if (( TOTAL > 0 )); then
              echo
              echo '<details><summary>Unique findings (first 200)</summary>'
              echo
              echo '| Tag | Platform | Severity | Vulnerability | Package | Installed | Fixed |'
              echo '| --- | --- | --- | --- | --- | --- | --- |'
              sort -u "$FINDINGS" | awk 'NR <= 200' |
                while IFS=$'\t' read -r TAG ARCH SEVERITY VULNERABILITY PACKAGE INSTALLED FIXED; do
                  printf '| `%s` | `%s` | %s | `%s` | `%s` | `%s` | `%s` |\n' \
                    "$TAG" "$ARCH" "$SEVERITY" "$VULNERABILITY" "$PACKAGE" "$INSTALLED" "$FIXED"
                done
              echo
              echo '</details>'
            fi
          } > "$REPORT"

          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          echo "findings=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "report=$REPORT" >> "$GITHUB_OUTPUT"

      - name: Open or update tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINDINGS: ${{ steps.scan.outputs.findings }}
          REPORT: ${{ steps.scan.outputs.report }}
        run: |
          ISSUE_NUMBER=$(gh issue list \
            --state all \
            --limit 1000 \
            --json number,state,title \
            --jq '[.[] | select(.title == "Scheduled CanastaBase image vulnerability scan")][0].number // empty')

          if (( FINDINGS > 0 )); then
            if [ -n "$ISSUE_NUMBER" ]; then
              gh issue reopen "$ISSUE_NUMBER" 2>/dev/null || true
              gh issue edit "$ISSUE_NUMBER" --body-file "$REPORT"
            else
              gh issue create --title "$ISSUE_TITLE" --body-file "$REPORT"
            fi
          elif [ -n "$ISSUE_NUMBER" ]; then
            STATE=$(gh issue view "$ISSUE_NUMBER" --json state --jq '.state')
            if [ "$STATE" = "OPEN" ]; then
              gh issue close "$ISSUE_NUMBER" \
                --comment "The latest scheduled scan found no fixable HIGH/CRITICAL vulnerabilities."
            fi
          fi
