# Directories the web server user can write to. No file in them is a web
# entry point (MediaWiki includes extension and skin code internally), so
# direct requests for PHP files are refused, and .htaccess files are ignored
# so that a planted one cannot map the PHP handler onto another extension.
# Each directory is listed under both the path it is reached by through the
# docroot and, for the symlinked ones, the path it resolves to.

<Directory /var/www/mediawiki/w/extensions>
    AllowOverride None
    <FilesMatch "(?i)\.(php[0-9]?|pht|phtml|phar|phps)$">
        Require all denied
    </FilesMatch>
</Directory>

<Directory /var/www/mediawiki/w/skins>
    AllowOverride None
    <FilesMatch "(?i)\.(php[0-9]?|pht|phtml|phar|phps)$">
        Require all denied
    </FilesMatch>
</Directory>

